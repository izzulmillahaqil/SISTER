<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Real-Time Broadcast Chat - SISTER</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f9; color: #333; }
        .container { max-width: 500px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { color: #007bff; margin-top: 0; text-align: center; }
        #chat-box { height: 250px; border: 1px solid #ccc; background: #fff; padding: 10px; overflow-y: scroll; margin-bottom: 10px; border-radius: 4px; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 10px; }
        button { background: #28a745; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; width: 100%; font-weight: bold; }
        button:hover { opacity: 0.9; }
        .message { margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Live Group Chat Server</h2>
        <div id="chat-box"></div>
        <input type="text" id="inputNama" placeholder="Masukkan nama kamu...">
        <input type="text" id="inputPesan" placeholder="Ketik pesan lalu enter...">
        <button onclick="kirimPesan()">Kirim Pesan ke Semua Device</button>
    </div>

    <script>
        // Otomatis mendeteksi IP server dan mengubah protokol http/https menjadi ws/wss
        const serverHost = window.location.hostname;    
        const ws = new WebSocket(`ws://${serverHost}:8000/ws/chat`);

        ws.onmessage = function(event) {
            let chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += `<div class="message">${event.data}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        };

        function kirimPesan() {
            let nama = document.getElementById('inputNama').value || "Anonim";
            let pesan = document.getElementById('inputPesan').value;

            if (!pesan) return;

            let formatPesan = `<b>${nama}:</b> ${pesan}`;
            ws.send(formatPesan);

            document.getElementById('inputPesan').value = '';
        }

        // Bisa tekan Enter untuk mengirim pesan
        document.getElementById('inputPesan').addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                kirimPesan();
            }
        });
    </script>
</body>
</html>
